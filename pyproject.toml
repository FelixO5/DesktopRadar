[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radarscope"
dynamic = ["version"]
description = "Always-on-top desktop radar scope plotting live ADS-B aircraft around a UK postcode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5",
    "httpx>=0.27",
    "tomli-w>=1.0",
    "platformdirs>=4.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
radarscope = "radarscope.main:main"

[tool.setuptools]
packages = ["radarscope"]

[tool.setuptools.dynamic]
version = { attr = "radarscope.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
